<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Experiencias 360</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/aframe@1.4.2/dist/aframe-master.min.js"></script>

  <script>
    /* ============================================================
       COMPONENTE: click-handler
       Escucha el evento 'click' de A-Frame (disparado por el
       raycaster de cualquier origen: mando, mano o cursor).
    ============================================================ */
    AFRAME.registerComponent('click-handler', {
      schema: { target: { type: 'string' } },
      init: function () {
        var self = this;
        this.el.addEventListener('click', function () {
          var t = self.data.target;
          if      (t === 'vid1') reproducirVideo(1);
          else if (t === 'vid2') reproducirVideo(2);
          else if (t === 'menu') volverAlMenu();
        });
      }
    });

    /* ============================================================
       COMPONENTE: hide-on-enter-vr
       Oculta el cursor de cabeza cuando se entra en modo VR
       (porque en VR usamos los mandos / manos).
    ============================================================ */
    AFRAME.registerComponent('hide-on-enter-vr', {
      init: function () {
        var el = this.el;
        this.el.sceneEl.addEventListener('enter-vr', function () {
          el.setAttribute('visible', 'false');
        });
        this.el.sceneEl.addEventListener('exit-vr', function () {
          el.setAttribute('visible', 'true');
        });
      }
    });
  </script>
</head>
<body>
<a-scene
  xr-mode-ui="enabled: true"
  vr-mode-ui="enabled: true"
  webxr="requiredFeatures: local-floor; optionalFeatures: hand-tracking, bounded-floor"
  renderer="colorManagement: true; physicallyCorrectLights: false"
  loading-screen="dotsColor: white; backgroundColor: black">

  <a-assets timeout="60000">
    <img   id="fondoMenu" src="fondo_principal.jpg">
    <img   id="thumb1"    src="miniatura_video1.png">
    <img   id="thumb2"    src="miniatura_video2.png">

    <video id="vid1"
           src="video_aventura.mp4"
           preload="auto" loop
           crossorigin="anonymous"
           playsinline webkit-playsinline>
    </video>
    <video id="vid2"
           src="video_playa.mp4"
           preload="auto" loop
           crossorigin="anonymous"
           playsinline webkit-playsinline>
    </video>
  </a-assets>

  <!-- SKY 360 -->
  <a-sky id="sky" src="#fondoMenu" rotation="0 -90 0"></a-sky>


  <!-- ============================================================
       MENU PRINCIPAL
  ============================================================ -->
  <a-entity id="menuPrincipal" position="0 1.6 -3">

    <a-text
      value="MIS EXPERIENCIAS 360"
      align="center"
      position="0 0.9 0"
      width="4"
      color="white">
    </a-text>

    <!-- Card 1: Aventura -->
    <a-image
      id="card1"
      src="#thumb1"
      width="1.4" height="0.85"
      position="-1.0 0 0"
      class="clickable"
      click-handler="target: vid1">
      <a-text value="Aventura" align="center"
              position="0 -0.55 0.05" width="2.5" color="white">
      </a-text>
    </a-image>

    <!-- Card 2: Relax -->
    <a-image
      id="card2"
      src="#thumb2"
      width="1.4" height="0.85"
      position="1.0 0 0"
      class="clickable"
      click-handler="target: vid2">
      <a-text value="Relax" align="center"
              position="0 -0.55 0.05" width="2.5" color="white">
      </a-text>
    </a-image>

  </a-entity>


  <!-- ============================================================
       BOTON VOLVER
  ============================================================ -->
  <a-entity id="botonVolver" position="0 0.8 -2.5" visible="false">
    <a-plane
      color="#111111" opacity="0.75"
      width="1.2" height="0.4"
      class="clickable"
      click-handler="target: menu">
    </a-plane>
    <a-text value="Volver al Menu" align="center"
            position="0 0 0.05" width="3" color="white">
    </a-text>
  </a-entity>


  <!-- ============================================================
       CAMARA
       El cursor de cabeza se oculta al entrar en VR.
  ============================================================ -->
  <a-entity camera look-controls wasd-controls position="0 1.6 0">
    <a-cursor
      id="cursorCabeza"
      color="#00d4ff"
      opacity="0.85"
      fuse="false"
      hide-on-enter-vr
      raycaster="objects: .clickable; recursive: false"
      animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
      animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 300; to: 1 1 1">
    </a-cursor>
  </a-entity>


  <!-- ============================================================
       MANDO DERECHO (Quest Touch / Touch Pro / Touch Plus)
       - oculus-touch-controls: modelo 3D del mando
       - raycaster: lanza rayo desde el mando hacia .clickable
       - line: dibuja la linea laser visible
  ============================================================ -->
  <a-entity
    id="mandoDerecho"
    oculus-touch-controls="hand: right"
    raycaster="objects: .clickable; recursive: false; showLine: true; lineColor: #00d4ff; lineOpacity: 0.75; far: 10"
    laser-controls="hand: right">
  </a-entity>


  <!-- ============================================================
       MANDO IZQUIERDO
  ============================================================ -->
  <a-entity
    id="mandoIzquierdo"
    oculus-touch-controls="hand: left"
    raycaster="objects: .clickable; recursive: false; showLine: true; lineColor: #00d4ff; lineOpacity: 0.75; far: 10"
    laser-controls="hand: left">
  </a-entity>


  <!-- ============================================================
       HAND TRACKING — MANO DERECHA
       oculus-hand-controls muestra el modelo de mano y
       expone gestos (pinch = pellizco = clic).
  ============================================================ -->
  <a-entity
    id="manoDerecha"
    oculus-hand-controls="hand: right; modelStyle: lowPoly; color: #ffccaa"
    hand-tracking-controls="hand: right"
    raycaster="objects: .clickable; recursive: false; showLine: true; lineColor: #ffffff; lineOpacity: 0.5; far: 10"
    hand-tracking-grab-controls="hand: right">
  </a-entity>


  <!-- ============================================================
       HAND TRACKING — MANO IZQUIERDA
  ============================================================ -->
  <a-entity
    id="manoIzquierda"
    oculus-hand-controls="hand: left; modelStyle: lowPoly; color: #ffccaa"
    hand-tracking-controls="hand: left"
    raycaster="objects: .clickable; recursive: false; showLine: true; lineColor: #ffffff; lineOpacity: 0.5; far: 10"
    hand-tracking-grab-controls="hand: left">
  </a-entity>


</a-scene>

<script>
  var sky         = document.getElementById('sky');
  var menuEl      = document.getElementById('menuPrincipal');
  var botonVolver = document.getElementById('botonVolver');
  var vid1El      = document.getElementById('vid1');
  var vid2El      = document.getElementById('vid2');
  var videoActual = null;

  function reproducirVideo(num) {
    if (videoActual) {
      videoActual.pause();
      videoActual.currentTime = 0;
    }
    var videoEl = (num === 1) ? vid1El : vid2El;
    videoActual = videoEl;

    sky.setAttribute('material', {
      src:    videoEl,
      color:  '#ffffff',
      shader: 'flat'
    });

    videoEl.play().catch(function (e) {
      console.warn('Autoplay bloqueado:', e);
    });

    menuEl.setAttribute('visible', 'false');
    botonVolver.setAttribute('visible', 'true');
  }

  function volverAlMenu() {
    if (videoActual) {
      videoActual.pause();
      videoActual.currentTime = 0;
      videoActual = null;
    }
    sky.setAttribute('material', {
      src:    document.getElementById('fondoMenu'),
      color:  '#ffffff',
      shader: 'flat'
    });
    menuEl.setAttribute('visible', 'true');
    botonVolver.setAttribute('visible', 'false');
  }

  /* Hover en las cards */
  ['card1', 'card2'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener('mouseenter', function () { el.setAttribute('scale', '1.08 1.08 1.08'); });
    el.addEventListener('mouseleave', function () { el.setAttribute('scale', '1 1 1'); });
  });
</script>
</body>
</html>
